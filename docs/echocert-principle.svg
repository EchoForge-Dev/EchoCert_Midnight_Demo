<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'IBM Plex Mono','Noto Sans SC',monospace">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#808080"/>
    </marker>
    <marker id="arrW" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#000000"/>

  <!-- canvas corner markers -->
  <path d="M10 24 V10 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 10 H950 V24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M10 536 V550 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 550 H950 V536" fill="none" stroke="#808080" stroke-opacity="0.4"/>

  <!-- header -->
  <text x="28" y="46" font-size="10" letter-spacing="3" fill="#808080">ECHOCERT MIDNIGHT · MLH HACKATHON DEMO</text>
  <text x="28" y="72" font-size="20" font-weight="700" letter-spacing="4" fill="#FFFFFF">PROVE ONE FIELD. HIDE THE REST.</text>
  <text x="28" y="92" font-size="11" fill="#808080">只证明一个字段，其余永不离开设备</text>
  <text x="932" y="46" font-size="9" letter-spacing="2" fill="#808080" text-anchor="end">COMPACT LANG 0.23</text>
  <text x="932" y="60" font-size="9" letter-spacing="2" fill="#808080" fill-opacity="0.6" text-anchor="end">MIDNIGHT NETWORK</text>
  <line x1="28" y1="106" x2="932" y2="106" stroke="#262626"/>

  <!-- step 1 : issuance strip -->
  <text x="28" y="132" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">[ 1 ] ISSUE · 签发（先行发生，一次）</text>
  <rect x="28" y="142" width="180" height="34" fill="#000000" stroke="#262626"/>
  <text x="40" y="163" font-size="10" fill="#FFFFFF">ISSUER 签发方</text>
  <line x1="208" y1="159" x2="380" y2="159" stroke="#808080" marker-end="url(#arr)"/>
  <text x="294" y="152" font-size="8.5" fill="#808080" text-anchor="middle">persistentCommit(五个字段, nonce)</text>
  <rect x="382" y="142" width="550" height="34" fill="#FFFFFF" fill-opacity="0.03" stroke="#262626"/>
  <text x="394" y="163" font-size="10" fill="#FFFFFF">commitments&#160;&#160;+= 0x9f4a…c21e</text>
  <text x="920" y="163" font-size="9" fill="#808080" text-anchor="end">◐ 32 BYTES · 内容不可反推</text>

  <!-- step 2 : holder device (private zone) -->
  <rect x="28" y="200" width="280" height="252" fill="#FFFFFF" fill-opacity="0.02" stroke="#808080" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="40" y="222" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">[ 2 ] HOLDER DEVICE — PRIVATE</text>
  <text x="40" y="236" font-size="9" fill="#808080">持有者设备 · 私密 ○</text>

  <text x="40" y="264" font-size="10" fill="#808080">SUBJECT</text>
  <text x="130" y="264" font-size="10" fill="#404040">████████████</text>
  <text x="40" y="288" font-size="10" fill="#808080">DEGREE</text>
  <text x="130" y="288" font-size="10" fill="#FFFFFF">M.Sc. Physics</text>
  <text x="252" y="288" font-size="9" fill="#808080">← 揭开 ●</text>
  <text x="40" y="312" font-size="10" fill="#808080">ISSUER</text>
  <text x="130" y="312" font-size="10" fill="#404040">████████████</text>
  <text x="40" y="336" font-size="10" fill="#808080">YEAR</text>
  <text x="130" y="336" font-size="10" fill="#404040">████████████</text>
  <text x="40" y="360" font-size="10" fill="#808080">ANCHOR</text>
  <text x="130" y="360" font-size="10" fill="#404040">████████████</text>
  <text x="40" y="384" font-size="10" fill="#808080">NONCE</text>
  <text x="130" y="384" font-size="10" fill="#404040">████████████</text>

  <line x1="40" y1="402" x2="296" y2="402" stroke="#262626"/>
  <text x="40" y="422" font-size="8.5" fill="#808080">涂黑 = 留在设备，永不上链</text>
  <text x="40" y="436" font-size="8.5" fill="#808080" fill-opacity="0.7">holder picks the one field to reveal</text>

  <!-- ZK boundary -->
  <line x1="342" y1="192" x2="342" y2="460" stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="2 5"/>
  <text x="342" y="480" font-size="8.5" letter-spacing="2" fill="#808080" text-anchor="middle">ZK BOUNDARY</text>

  <!-- step 3 : circuit -->
  <rect x="376" y="200" width="248" height="252" fill="#000000" stroke="#262626"/>
  <text x="388" y="222" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">[ 3 ] CIRCUIT · 证明内</text>
  <text x="388" y="236" font-size="9" fill="#808080">proveDegree()</text>

  <text x="388" y="268" font-size="10" fill="#FFFFFF">1· 重算 commitment</text>
  <text x="404" y="284" font-size="8.5" fill="#808080">用设备上的字段 + nonce</text>
  <text x="388" y="312" font-size="10" fill="#FFFFFF">2· assert ∈ commitments</text>
  <text x="404" y="328" font-size="8.5" fill="#808080">证明凭证确实被签发过（防伪）</text>
  <text x="388" y="356" font-size="10" fill="#FFFFFF">3· disclose(degree)</text>
  <text x="404" y="372" font-size="8.5" fill="#808080">只放行这一个字段</text>

  <line x1="388" y1="392" x2="612" y2="392" stroke="#262626"/>
  <text x="388" y="412" font-size="8.5" fill="#808080">assert 在证明内运行：</text>
  <text x="388" y="426" font-size="8.5" fill="#808080">只泄露「通过了」这一个比特</text>
  <text x="388" y="440" font-size="8.5" fill="#808080" fill-opacity="0.7">runs locally, ~1–3 s real proving</text>

  <!-- arrows across -->
  <line x1="308" y1="326" x2="374" y2="326" stroke="#FFFFFF" marker-end="url(#arrW)"/>
  <line x1="624" y1="326" x2="690" y2="326" stroke="#FFFFFF" marker-end="url(#arrW)"/>
  <text x="657" y="318" font-size="8.5" fill="#808080" text-anchor="middle">288 B</text>

  <!-- step 4 : on midnight (public) -->
  <rect x="692" y="200" width="240" height="252" fill="#FFFFFF" fill-opacity="0.03" stroke="#262626"/>
  <text x="704" y="222" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">[ 4 ] ON MIDNIGHT — PUBLIC</text>
  <text x="704" y="236" font-size="9" fill="#808080">链上 · 任何人可验证 ●</text>

  <text x="704" y="266" font-size="9" fill="#808080">PROOF</text>
  <text x="704" y="282" font-size="10" fill="#FFFFFF">0x7b1e…44af</text>
  <text x="704" y="310" font-size="9" fill="#808080">PUBLIC</text>
  <text x="704" y="326" font-size="10" fill="#FFFFFF">degree = "M.Sc. Physics"</text>

  <line x1="704" y1="348" x2="920" y2="348" stroke="#262626"/>

  <text x="704" y="374" font-size="11" fill="#4ade80">✓ VALID</text>
  <text x="704" y="394" font-size="8.5" fill="#808080">验证者学到：这一个字段，</text>
  <text x="704" y="408" font-size="8.5" fill="#808080">以及它是真的。仅此而已。</text>
  <text x="704" y="428" font-size="8.5" fill="#808080" fill-opacity="0.7">who holds it · 不可关联</text>
  <text x="704" y="442" font-size="8.5" fill="#808080" fill-opacity="0.7">other 4 fields · 从未离开设备</text>

  <!-- footer -->
  <line x1="28" y1="506" x2="932" y2="506" stroke="#262626"/>
  <text x="28" y="530" font-size="9" letter-spacing="2" fill="#808080">○ LOCAL 本地&#160;&#160;&#160;◐ SHIELDED 遮蔽&#160;&#160;&#160;● PUBLIC 公开</text>
  <text x="932" y="530" font-size="9" letter-spacing="2" fill="#808080" text-anchor="end">一切为简 · ALL FOR SIMPLE · ECHOFORGE</text>
</svg>
