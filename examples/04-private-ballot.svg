<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'IBM Plex Mono','Noto Sans SC',monospace">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#808080"/>
    </marker>
    <marker id="arrW" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#000000"/>

  <!-- canvas corner markers -->
  <path d="M10 24 V10 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 10 H950 V24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M10 536 V550 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 550 H950 V536" fill="none" stroke="#808080" stroke-opacity="0.4"/>

  <!-- header -->
  <text x="28" y="46" font-size="10" letter-spacing="3" fill="#808080">EXAMPLE_04 · ECHOVOTE DIRECTION</text>
  <text x="28" y="72" font-size="20" font-weight="700" letter-spacing="5" fill="#FFFFFF">PRIVATE BALLOT</text>
  <text x="28" y="92" font-size="11" fill="#808080">计票公开，投票人身份隐藏 — nullifier 防止重复投票</text>
  <text x="932" y="46" font-size="9" letter-spacing="2" fill="#808080" text-anchor="end">COMPACT LANG 0.23</text>
  <text x="932" y="60" font-size="9" letter-spacing="2" fill="#808080" fill-opacity="0.6" text-anchor="end">MIDNIGHT NETWORK</text>
  <line x1="28" y1="106" x2="932" y2="106" stroke="#262626"/>

  <!-- voter private zone -->
  <rect x="28" y="132" width="260" height="180" fill="#FFFFFF" fill-opacity="0.02" stroke="#808080" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="40" y="154" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">VOTER — PRIVATE / 投票人 · 私密</text>

  <rect x="40" y="170" width="236" height="56" fill="#000000" stroke="#262626"/>
  <text x="52" y="190" font-size="10" fill="#FFFFFF">witness voterSecret()</text>
  <text x="52" y="210" font-size="11" fill="#FFFFFF" fill-opacity="0.85">0x2c88…7b1f</text>

  <rect x="40" y="238" width="236" height="56" fill="#000000" stroke="#262626"/>
  <text x="52" y="258" font-size="10" fill="#FFFFFF">nullifier = commit(tag, secret)</text>
  <text x="52" y="278" font-size="11" fill="#FFFFFF" fill-opacity="0.85">b3d9…11ce</text>

  <text x="40" y="330" font-size="8.5" fill="#808080">one secret → one nullifier → one vote</text>
  <text x="40" y="344" font-size="8.5" fill="#808080" fill-opacity="0.7">一个秘密 → 一个 nullifier → 一票</text>

  <!-- admin box -->
  <rect x="28" y="366" width="260" height="70" fill="#FFFFFF" fill-opacity="0.04" stroke="#262626"/>
  <text x="40" y="388" font-size="9" letter-spacing="2" fill="#808080">ADMIN / 管理员</text>
  <text x="40" y="410" font-size="11" fill="#FFFFFF" fill-opacity="0.85">tx: closeBallot()</text>
  <text x="40" y="426" font-size="8.5" fill="#808080">key derived from admin secret</text>

  <!-- circuits panel -->
  <rect x="340" y="120" width="300" height="316" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M346 134 V126 H354" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M626 126 H634 V134 M634 422 V430 H626" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M346 422 V430 H354" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="356" y="144" font-size="9" letter-spacing="2" fill="#808080">CIRCUITS / 电路</text>

  <rect x="356" y="158" width="268" height="150" fill="#000000" stroke="#262626"/>
  <text x="368" y="178" font-size="10" fill="#FFFFFF">vote(voteYes: Boolean)</text>
  <text x="368" y="198" font-size="9.5" fill="#808080">assert ballotState == OPEN</text>
  <text x="368" y="214" font-size="9.5" fill="#808080">assert !nullifiers.member(n)</text>
  <text x="368" y="230" font-size="9.5" fill="#808080">nullifiers.insert(n)</text>
  <text x="368" y="246" font-size="9.5" fill="#808080">if disclose(voteYes): yes +1</text>
  <text x="368" y="262" font-size="9.5" fill="#808080">else: no +1</text>
  <text x="368" y="284" font-size="8.5" fill="#808080" fill-opacity="0.7">branch on a private param = a disclosure —</text>
  <text x="368" y="298" font-size="8.5" fill="#808080" fill-opacity="0.7">disclose() makes it explicit, not accidental</text>

  <rect x="356" y="324" width="268" height="94" fill="#000000" stroke="#262626"/>
  <text x="368" y="344" font-size="10" fill="#FFFFFF">closeBallot()</text>
  <text x="368" y="364" font-size="9.5" fill="#808080">assert voterKey(secret) == admin</text>
  <text x="368" y="380" font-size="9.5" fill="#808080">assert ballotState == OPEN</text>
  <text x="368" y="396" font-size="9.5" fill="#808080">ballotState = CLOSED</text>

  <!-- ledger -->
  <rect x="692" y="120" width="240" height="316" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <path d="M698 134 V126 H706" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M918 126 H926 V134 M926 422 V430 H918" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M698 422 V430 H706" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="708" y="144" font-size="9" letter-spacing="2" fill="#808080">PUBLIC LEDGER / 公开账本</text>

  <text x="708" y="176" font-size="9" letter-spacing="1.5" fill="#808080">BALLOTSTATE · ENUM</text>
  <circle cx="712" cy="192" r="3" fill="#4EDE80"/>
  <text x="722" y="196" font-size="11" fill="#FFFFFF">OPEN</text>
  <line x1="708" y1="212" x2="916" y2="212" stroke="#262626"/>

  <text x="708" y="234" font-size="9" letter-spacing="1.5" fill="#808080">TALLY / 计票</text>
  <text x="708" y="256" font-size="10" fill="#808080">YES</text>
  <text x="758" y="256" font-size="13" fill="#FFFFFF">12</text>
  <rect x="800" y="246" width="112" height="3" fill="#262626"/>
  <rect x="800" y="246" width="79" height="3" fill="#FFFFFF"/>
  <text x="708" y="280" font-size="10" fill="#808080">NO</text>
  <text x="758" y="280" font-size="13" fill="#FFFFFF">5</text>
  <rect x="800" y="270" width="112" height="3" fill="#262626"/>
  <rect x="800" y="270" width="33" height="3" fill="#808080"/>
  <line x1="708" y1="298" x2="916" y2="298" stroke="#262626"/>

  <text x="708" y="320" font-size="9" letter-spacing="1.5" fill="#808080">NULLIFIERS · SET&lt;BYTES&lt;32&gt;&gt;</text>
  <text x="708" y="340" font-size="10" fill="#FFFFFF" fill-opacity="0.8">b3d9…11ce</text>
  <text x="708" y="358" font-size="10" fill="#FFFFFF" fill-opacity="0.8">40e6…9a02</text>
  <text x="708" y="376" font-size="10" fill="#FFFFFF" fill-opacity="0.8">f512…c7d8</text>
  <text x="708" y="398" font-size="8.5" fill="#808080">reveals participation, not identity</text>
  <text x="708" y="412" font-size="8.5" fill="#808080" fill-opacity="0.7">只暴露参与数量，不暴露身份</text>

  <!-- arrows -->
  <line x1="288" y1="266" x2="352" y2="230" stroke="#FFFFFF" stroke-opacity="0.8" marker-end="url(#arrW)"/>
  <text x="320" y="240" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π</text>
  <line x1="288" y1="400" x2="352" y2="372" stroke="#808080" marker-end="url(#arr)"/>
  <line x1="624" y1="238" x2="688" y2="256" stroke="#808080" marker-end="url(#arr)"/>
  <line x1="624" y1="370" x2="688" y2="190" stroke="#808080" stroke-opacity="0.6" marker-end="url(#arr)"/>

  <!-- footer -->
  <line x1="28" y1="474" x2="932" y2="474" stroke="#262626"/>
  <text x="28" y="498" font-size="9.5" letter-spacing="1.5" fill="#808080">WHO VOTED — HIDDEN · VOTE DIRECTION — VISIBLE PER TX · TALLY — PUBLIC. FULL DIRECTION PRIVACY NEEDS COMMIT-REVEAL.</text>
  <text x="28" y="516" font-size="9.5" fill="#808080" fill-opacity="0.7">谁投的票——隐藏；单笔投向——可见；计票——公开。要隐藏投向需 commit-reveal 聚合。学习点：nullifier / 状态机 / disclose 分支</text>
</svg>
