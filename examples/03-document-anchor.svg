<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'IBM Plex Mono','Noto Sans SC',monospace">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#808080"/>
    </marker>
    <marker id="arrW" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#000000"/>

  <!-- canvas corner markers -->
  <path d="M10 24 V10 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 10 H950 V24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M10 536 V550 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 550 H950 V536" fill="none" stroke="#808080" stroke-opacity="0.4"/>

  <!-- header -->
  <text x="28" y="46" font-size="10" letter-spacing="3" fill="#808080">EXAMPLE_03 · ECHOUPLOADER DIRECTION</text>
  <text x="28" y="72" font-size="20" font-weight="700" letter-spacing="5" fill="#FFFFFF">DOCUMENT ANCHOR</text>
  <text x="28" y="92" font-size="11" fill="#808080">付费锚定文档哈希 — 文件本身永不上链</text>
  <text x="932" y="46" font-size="9" letter-spacing="2" fill="#808080" text-anchor="end">COMPACT LANG 0.23</text>
  <text x="932" y="60" font-size="9" letter-spacing="2" fill="#808080" fill-opacity="0.6" text-anchor="end">MIDNIGHT NETWORK</text>
  <line x1="28" y1="106" x2="932" y2="106" stroke="#262626"/>

  <!-- user box -->
  <rect x="28" y="132" width="252" height="132" fill="#FFFFFF" fill-opacity="0.04" stroke="#262626"/>
  <text x="40" y="154" font-size="9" letter-spacing="2" fill="#808080">USER / 用户</text>
  <text x="40" y="178" font-size="10" fill="#FFFFFF">file.pdf → sha256 (local)</text>
  <text x="40" y="198" font-size="11" fill="#FFFFFF" fill-opacity="0.85">docHash: 0x8e12…d944</text>
  <line x1="40" y1="214" x2="268" y2="214" stroke="#262626"/>
  <text x="40" y="234" font-size="8.5" fill="#808080">the file never leaves the device</text>
  <text x="40" y="248" font-size="8.5" fill="#808080" fill-opacity="0.7">文件永不离开设备 — 只锚定哈希</text>

  <!-- owner box -->
  <rect x="28" y="330" width="252" height="94" fill="#FFFFFF" fill-opacity="0.04" stroke="#262626"/>
  <text x="40" y="352" font-size="9" letter-spacing="2" fill="#808080">OWNER / 合约所有者</text>
  <text x="40" y="374" font-size="11" fill="#FFFFFF" fill-opacity="0.85">tx: claimFees(to)</text>
  <text x="40" y="394" font-size="8.5" fill="#808080">authenticated by ownerSecret()</text>
  <text x="40" y="408" font-size="8.5" fill="#808080" fill-opacity="0.7">身份 = 秘密派生的公钥，非钱包地址</text>

  <!-- circuits panel -->
  <rect x="332" y="120" width="308" height="316" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M338 134 V126 H346" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M626 126 H634 V134 M634 422 V430 H626" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M338 422 V430 H346" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="348" y="144" font-size="9" letter-spacing="2" fill="#808080">CIRCUITS / 电路</text>

  <rect x="348" y="158" width="276" height="122" fill="#000000" stroke="#262626"/>
  <text x="360" y="178" font-size="10" fill="#FFFFFF">anchor(docHash)</text>
  <text x="360" y="198" font-size="9.5" fill="#808080">hash = disclose(docHash)</text>
  <text x="360" y="214" font-size="9.5" fill="#808080">assert !anchors.member(hash)</text>
  <text x="360" y="230" font-size="9.5" fill="#808080">receiveUnshielded(native, fee)</text>
  <text x="360" y="246" font-size="9.5" fill="#808080">anchors.insert(hash)</text>
  <text x="360" y="262" font-size="9.5" fill="#808080">unclaimedFees.increment(fee)</text>

  <rect x="348" y="296" width="276" height="122" fill="#000000" stroke="#262626"/>
  <text x="360" y="316" font-size="10" fill="#FFFFFF">claimFees(to)</text>
  <text x="360" y="336" font-size="9.5" fill="#808080">assert ownerKey(secret) == owner</text>
  <text x="360" y="352" font-size="9.5" fill="#808080">assert balance ≥ total</text>
  <text x="360" y="368" font-size="9.5" fill="#808080">sendUnshielded(native, total, to)</text>
  <text x="360" y="384" font-size="9.5" fill="#808080">unclaimedFees.resetToDefault()</text>
  <text x="360" y="406" font-size="8.5" fill="#808080" fill-opacity="0.7">state machine avoids double-claim drift</text>

  <!-- ledger -->
  <rect x="692" y="120" width="240" height="316" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <path d="M698 134 V126 H706" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M918 126 H926 V134 M926 422 V430 H918" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M698 422 V430 H706" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="708" y="144" font-size="9" letter-spacing="2" fill="#808080">PUBLIC LEDGER / 公开账本</text>

  <text x="708" y="176" font-size="9" letter-spacing="1.5" fill="#808080">OWNER · BYTES&lt;32&gt;</text>
  <text x="708" y="192" font-size="10" fill="#FFFFFF" fill-opacity="0.85">4bd1…09ef</text>
  <rect x="850" y="164" width="58" height="16" fill="none" stroke="#808080" stroke-opacity="0.5"/>
  <text x="879" y="175.5" font-size="8" letter-spacing="1.5" fill="#808080" text-anchor="middle">SEALED</text>

  <text x="708" y="220" font-size="9" letter-spacing="1.5" fill="#808080">ANCHORFEE · UINT&lt;16&gt;</text>
  <text x="708" y="236" font-size="10" fill="#FFFFFF" fill-opacity="0.85">1</text>
  <rect x="850" y="208" width="58" height="16" fill="none" stroke="#808080" stroke-opacity="0.5"/>
  <text x="879" y="219.5" font-size="8" letter-spacing="1.5" fill="#808080" text-anchor="middle">SEALED</text>
  <line x1="708" y1="252" x2="916" y2="252" stroke="#262626"/>

  <text x="708" y="274" font-size="9" letter-spacing="1.5" fill="#808080">ANCHORS · SET&lt;BYTES&lt;32&gt;&gt;</text>
  <text x="708" y="294" font-size="10" fill="#FFFFFF" fill-opacity="0.8">8e12…d944</text>
  <text x="708" y="312" font-size="10" fill="#FFFFFF" fill-opacity="0.8">77af…03bc</text>
  <text x="708" y="330" font-size="10" fill="#FFFFFF" fill-opacity="0.8">c0de…52a1</text>
  <line x1="708" y1="348" x2="916" y2="348" stroke="#262626"/>

  <text x="708" y="370" font-size="9" letter-spacing="1.5" fill="#808080">UNCLAIMEDFEES · COUNTER</text>
  <text x="708" y="390" font-size="14" fill="#FFFFFF">3</text>
  <circle cx="712" cy="410" r="3" fill="#4EDE80"/>
  <text x="722" y="413.5" font-size="9" letter-spacing="1.5" fill="#808080">+1 EUP PER ANCHOR (ECOSYSTEM)</text>

  <!-- arrows -->
  <line x1="280" y1="198" x2="344" y2="210" stroke="#808080" marker-end="url(#arr)"/>
  <text x="312" y="190" font-size="8.5" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">hash + fee</text>
  <line x1="280" y1="372" x2="344" y2="356" stroke="#808080" marker-end="url(#arr)"/>
  <line x1="624" y1="220" x2="688" y2="300" stroke="#808080" marker-end="url(#arr)"/>
  <line x1="466" y1="418" x2="466" y2="436" stroke="#FFFFFF" stroke-opacity="0"/>
  <path d="M348 380 C 300 380 300 380 284 380" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" marker-end="url(#arrW)"/>
  <text x="316" y="371" font-size="8.5" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">total →</text>

  <!-- footer -->
  <line x1="28" y1="474" x2="932" y2="474" stroke="#262626"/>
  <text x="28" y="498" font-size="9.5" letter-spacing="1.5" fill="#808080">HASH-ONLY ANCHORING — PUBLIC BY DESIGN, SO THE PARAMETER IS disclose()D ONCE, EXPLICITLY, AT THE TOP.</text>
  <text x="28" y="516" font-size="9.5" fill="#808080" fill-opacity="0.7">哈希锚定本来就该公开，所以在电路开头显式 disclose() 一次。学习点：unshielded 代币收付 / 所有者鉴权 / Counter 归零</text>
</svg>
