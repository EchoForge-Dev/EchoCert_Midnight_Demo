<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'IBM Plex Mono','Noto Sans SC',monospace">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#808080"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#000000"/>

  <!-- canvas corner markers -->
  <path d="M10 24 V10 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 10 H950 V24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M10 516 V530 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 530 H950 V516" fill="none" stroke="#808080" stroke-opacity="0.4"/>

  <!-- header -->
  <text x="28" y="46" font-size="10" letter-spacing="3" fill="#808080">EXAMPLE_01</text>
  <text x="28" y="72" font-size="20" font-weight="700" letter-spacing="5" fill="#FFFFFF">COUNTER</text>
  <text x="28" y="92" font-size="11" fill="#808080">公开计数器 — Compact 的 hello world</text>
  <text x="932" y="46" font-size="9" letter-spacing="2" fill="#808080" text-anchor="end">COMPACT LANG 0.23</text>
  <text x="932" y="60" font-size="9" letter-spacing="2" fill="#808080" fill-opacity="0.6" text-anchor="end">MIDNIGHT NETWORK</text>
  <line x1="28" y1="106" x2="932" y2="106" stroke="#262626"/>

  <!-- callers -->
  <rect x="28" y="150" width="192" height="76" fill="#FFFFFF" fill-opacity="0.04" stroke="#262626"/>
  <text x="40" y="172" font-size="9" letter-spacing="2" fill="#808080">DEPLOYER / 部署者</text>
  <text x="40" y="196" font-size="11" fill="#FFFFFF" fill-opacity="0.85">constructor(limit)</text>
  <text x="40" y="212" font-size="9" fill="#808080">runs once at deploy</text>

  <rect x="28" y="290" width="192" height="76" fill="#FFFFFF" fill-opacity="0.04" stroke="#262626"/>
  <text x="40" y="312" font-size="9" letter-spacing="2" fill="#808080">ANYONE / 任何人</text>
  <text x="40" y="336" font-size="11" fill="#FFFFFF" fill-opacity="0.85">tx: increment()</text>
  <text x="40" y="352" font-size="9" fill="#808080">no key, no witness</text>

  <!-- circuits panel -->
  <rect x="304" y="132" width="312" height="256" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M310 146 V138 H318" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M602 138 H610 V146 M610 374 V382 H602" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M310 374 V382 H318" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="320" y="156" font-size="9" letter-spacing="2" fill="#808080">CIRCUITS / 电路</text>

  <rect x="320" y="170" width="280" height="86" fill="#000000" stroke="#262626"/>
  <text x="332" y="190" font-size="10" fill="#FFFFFF">constructor(limit: Uint&lt;16&gt;)</text>
  <text x="332" y="210" font-size="9.5" fill="#808080">assert(limit &gt; 0, "...")</text>
  <text x="332" y="226" font-size="9.5" fill="#808080">maxRounds = disclose(limit)</text>
  <text x="332" y="244" font-size="8.5" fill="#808080" fill-opacity="0.7">constructor args are private by default → disclose()</text>

  <rect x="320" y="284" width="280" height="86" fill="#000000" stroke="#262626"/>
  <text x="332" y="304" font-size="10" fill="#FFFFFF">increment()</text>
  <text x="332" y="324" font-size="9.5" fill="#808080">assert(round.lessThan(maxRounds))</text>
  <text x="332" y="340" font-size="9.5" fill="#808080">round.increment(1)</text>
  <text x="332" y="358" font-size="8.5" fill="#808080" fill-opacity="0.7">fails when the sealed limit is reached</text>

  <!-- ledger panel -->
  <rect x="692" y="132" width="240" height="256" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <path d="M698 146 V138 H706" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M918 138 H926 V146 M926 374 V382 H918" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M698 374 V382 H706" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="708" y="156" font-size="9" letter-spacing="2" fill="#808080">PUBLIC LEDGER / 公开账本</text>

  <text x="708" y="192" font-size="9" letter-spacing="1.5" fill="#808080">MAXROUNDS · UINT&lt;16&gt;</text>
  <text x="708" y="210" font-size="12" fill="#FFFFFF">100</text>
  <rect x="850" y="180" width="58" height="16" fill="none" stroke="#808080" stroke-opacity="0.5"/>
  <text x="879" y="191.5" font-size="8" letter-spacing="1.5" fill="#808080" text-anchor="middle">SEALED</text>
  <line x1="708" y1="228" x2="916" y2="228" stroke="#262626"/>

  <text x="708" y="252" font-size="9" letter-spacing="1.5" fill="#808080">ROUND · COUNTER</text>
  <text x="708" y="274" font-size="16" fill="#FFFFFF">7</text>
  <rect x="708" y="288" width="208" height="2" fill="#262626"/>
  <rect x="708" y="288" width="15" height="2" fill="#FFFFFF"/>
  <text x="708" y="306" font-size="8.5" fill="#808080" fill-opacity="0.7">7 / 100 rounds used</text>

  <circle cx="712" cy="348" r="3" fill="#4EDE80"/>
  <text x="722" y="351.5" font-size="9" letter-spacing="1.5" fill="#808080">STATE FULLY PUBLIC</text>
  <text x="722" y="367" font-size="9" fill="#808080" fill-opacity="0.7">状态完全公开</text>

  <!-- arrows -->
  <line x1="220" y1="188" x2="316" y2="200" stroke="#808080" marker-end="url(#arr)"/>
  <line x1="220" y1="328" x2="316" y2="322" stroke="#808080" marker-end="url(#arr)"/>
  <line x1="600" y1="213" x2="688" y2="205" stroke="#808080" marker-end="url(#arr)"/>
  <text x="644" y="196" font-size="8.5" fill="#808080" text-anchor="middle">write once</text>
  <line x1="600" y1="327" x2="688" y2="268" stroke="#808080" marker-end="url(#arr)"/>
  <text x="652" y="310" font-size="8.5" fill="#808080" text-anchor="middle">+1</text>

  <!-- footer -->
  <line x1="28" y1="470" x2="932" y2="470" stroke="#262626"/>
  <text x="28" y="494" font-size="9.5" letter-spacing="1.5" fill="#808080">NO WITNESS · NO PRIVATE STATE · EVERY VALUE ON THIS DIAGRAM IS ON-CHAIN AND PUBLIC</text>
  <text x="28" y="512" font-size="9.5" fill="#808080" fill-opacity="0.7">没有 witness、没有私密状态——本图中的每个值都公开上链。学习点：pragma / ledger / sealed / Counter / disclose()</text>
</svg>
