<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'IBM Plex Mono','Noto Sans SC',monospace">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#808080"/>
    </marker>
    <marker id="arrW" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#000000"/>

  <!-- canvas corner markers -->
  <path d="M10 24 V10 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 10 H950 V24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M10 536 V550 H24" fill="none" stroke="#808080" stroke-opacity="0.4"/>
  <path d="M936 550 H950 V536" fill="none" stroke="#808080" stroke-opacity="0.4"/>

  <!-- header -->
  <text x="28" y="46" font-size="10" letter-spacing="3" fill="#808080">EXAMPLE_02 · ECHOID DIRECTION</text>
  <text x="28" y="72" font-size="20" font-weight="700" letter-spacing="5" fill="#FFFFFF">AGE CREDENTIAL</text>
  <text x="28" y="92" font-size="11" fill="#808080">不泄露出生年份，证明「我已满 N 岁」</text>
  <text x="932" y="46" font-size="9" letter-spacing="2" fill="#808080" text-anchor="end">COMPACT LANG 0.23</text>
  <text x="932" y="60" font-size="9" letter-spacing="2" fill="#808080" fill-opacity="0.6" text-anchor="end">MIDNIGHT NETWORK</text>
  <line x1="28" y1="106" x2="932" y2="106" stroke="#262626"/>

  <!-- private zone -->
  <rect x="28" y="132" width="272" height="268" fill="#FFFFFF" fill-opacity="0.02" stroke="#808080" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="40" y="154" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">HOLDER DEVICE — PRIVATE</text>
  <text x="40" y="168" font-size="9" fill="#808080">持有者本地 · 私密</text>

  <rect x="40" y="184" width="248" height="62" fill="#000000" stroke="#262626"/>
  <text x="52" y="204" font-size="10" fill="#FFFFFF">witness birthYear()</text>
  <text x="52" y="224" font-size="12" fill="#FFFFFF" fill-opacity="0.85">2008</text>
  <text x="110" y="224" font-size="9" fill="#808080">← the secret being protected</text>

  <rect x="40" y="258" width="248" height="62" fill="#000000" stroke="#262626"/>
  <text x="52" y="278" font-size="10" fill="#FFFFFF">witness holderSecret()</text>
  <text x="52" y="298" font-size="11" fill="#FFFFFF" fill-opacity="0.85">0x5f9a…44c3</text>

  <text x="40" y="346" font-size="8.5" fill="#808080">witness values never leave this box</text>
  <text x="40" y="360" font-size="8.5" fill="#808080" fill-opacity="0.7">witness 返回值永不离开设备</text>
  <text x="40" y="386" font-size="8.5" fill="#808080" fill-opacity="0.7">proof is generated locally / 证明在本地生成</text>

  <!-- ZK boundary -->
  <line x1="342" y1="120" x2="342" y2="412" stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="2 5"/>
  <text x="342" y="430" font-size="9" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">ZK PROOF BOUNDARY</text>
  <text x="342" y="444" font-size="8.5" fill="#808080" text-anchor="middle">只有证明穿过 · only the proof crosses</text>

  <!-- proof arrow -->
  <line x1="300" y1="252" x2="380" y2="252" stroke="#FFFFFF" stroke-opacity="0.8" marker-end="url(#arrW)"/>
  <text x="340" y="243" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π</text>

  <!-- circuit -->
  <rect x="384" y="170" width="292" height="182" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M390 184 V176 H398" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M662 176 H670 V184 M670 338 V346 H662" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M390 338 V346 H398" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="396" y="194" font-size="9" letter-spacing="2" fill="#808080">CIRCUIT</text>
  <text x="396" y="214" font-size="11" fill="#FFFFFF">proveAge(currentYear)</text>
  <line x1="396" y1="228" x2="664" y2="228" stroke="#262626"/>
  <text x="396" y="250" font-size="9.5" fill="#808080">assert birth + minAge ≤ currentYear</text>
  <text x="396" y="270" font-size="9.5" fill="#808080">holderId = persistentCommit(tag, secret)</text>
  <text x="396" y="290" font-size="9.5" fill="#808080">assert !verified.member(holderId)</text>
  <text x="396" y="310" font-size="9.5" fill="#808080">verified.insert(holderId)</text>
  <text x="396" y="334" font-size="8.5" fill="#808080" fill-opacity="0.7">asserts run inside the proof — inputs stay hidden</text>

  <!-- ledger -->
  <rect x="716" y="132" width="216" height="268" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <path d="M722 146 V138 H730" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M918 138 H926 V146 M926 386 V394 H918" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <path d="M722 386 V394 H730" fill="none" stroke="#808080" stroke-opacity="0.35"/>
  <text x="730" y="156" font-size="9" letter-spacing="2" fill="#808080">PUBLIC LEDGER / 公开账本</text>

  <text x="730" y="190" font-size="9" letter-spacing="1.5" fill="#808080">MINAGE · UINT&lt;8&gt;</text>
  <text x="730" y="208" font-size="12" fill="#FFFFFF">18</text>
  <rect x="850" y="178" width="58" height="16" fill="none" stroke="#808080" stroke-opacity="0.5"/>
  <text x="879" y="189.5" font-size="8" letter-spacing="1.5" fill="#808080" text-anchor="middle">SEALED</text>
  <line x1="730" y1="224" x2="916" y2="224" stroke="#262626"/>

  <text x="730" y="246" font-size="9" letter-spacing="1.5" fill="#808080">VERIFIED · SET&lt;BYTES&lt;32&gt;&gt;</text>
  <text x="730" y="268" font-size="10" fill="#FFFFFF" fill-opacity="0.8">9c41…f2a7</text>
  <text x="730" y="286" font-size="10" fill="#FFFFFF" fill-opacity="0.8">03be…881d</text>
  <text x="730" y="304" font-size="10" fill="#FFFFFF" fill-opacity="0.8">e7d0…5c22</text>
  <text x="730" y="326" font-size="8.5" fill="#808080">commitments only — unlinkable</text>
  <text x="730" y="340" font-size="8.5" fill="#808080" fill-opacity="0.7">只有承诺值，无法反推身份</text>

  <circle cx="734" cy="372" r="3" fill="#4EDE80"/>
  <text x="744" y="375.5" font-size="9" letter-spacing="1.5" fill="#808080">PROOF VERIFIED ON-CHAIN</text>

  <!-- circuit -> ledger arrow -->
  <line x1="676" y1="300" x2="712" y2="286" stroke="#808080" marker-end="url(#arr)"/>

  <!-- footer -->
  <line x1="28" y1="474" x2="932" y2="474" stroke="#262626"/>
  <text x="28" y="498" font-size="9.5" letter-spacing="1.5" fill="#808080">THE CHAIN LEARNS ONE BIT — "OLD ENOUGH" — PLUS AN UNLINKABLE COMMITMENT. THE BIRTH YEAR NEVER LEAVES THE DEVICE.</text>
  <text x="28" y="516" font-size="9.5" fill="#808080" fill-opacity="0.7">链上只得到一个比特（「已达标」）和一个不可关联的承诺值；出生年份从未离开设备。学习点：witness / 私密断言 / persistentCommit</text>
</svg>
